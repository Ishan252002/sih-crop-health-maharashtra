  <linearGradient id="grain" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8d79a"/><stop offset="0.55" stop-color="#d2ba6d"/><stop offset="1" stop-color="#ab914b"/></linearGradient>
